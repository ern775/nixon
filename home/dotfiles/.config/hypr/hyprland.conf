# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

$ipc = noctalia-shell ipc call

# Core binds
bind = $mainMod, SUPER_L, exec, $ipc launcher toggle
bind = $mainMod, S, exec, $ipc controlCenter toggle
bind = $mainMod, comma, exec, $ipc settings toggle

bind = $mainMod SHIFT, B, exec, $ipc bar toggle
bind = $mainMod, V, exec, $ipc launcher clipboard
bind = $mainMod, Z, exec, $ipc notifications toggleHistory
bind = $mainMod CTRL, Z, exec, $ipc notifications clear
bind = $mainMod, C, exec, $ipc media toggle
bind = $mainMod, X, exec, $ipc volume togglePanel
bind = $mainMod, B, exec, $ipc bluetooth togglePanel
bindl = $mainMod CTRL, B, exec, $ipc bluetooth toggle
bind = $mainMod, W, exec, $ipc network togglePanel
bindl = $mainMod CTRL, W, exec, $ipc wifi toggle
bind = $mainMod, L, exec, $ipc lockScreen lock && sleep 3 && hyprctl dispatch dpms off
bind = $mainMod, Escape, exec, $ipc systemMonitor toggle
bind = CTRL ALT, Escape, exec, $ipc sessionMenu toggle

bindl = , XF86PowerOff, exec, hyprctl dispatch dpms off
# bindl = , Escape, exec, sleep 0.1 && hyprctl dispatch dpms off

# bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bindel = SHIFT, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = SHIFT, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindl = , XF86AudioMute, exec, $ipc volume muteOutput
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindel = CTRL, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 2%+
bindel = CTRL, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 2%-
bindl = CTRL, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = , XF86MonBrightnessUp, exec, brightnessctl s -n 1%+
bindel = SHIFT, XF86MonBrightnessUp, exec, brightnessctl s -n 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s -n 1%-
bindel = SHIFT, XF86MonBrightnessDown, exec, brightnessctl s -n 5%-

bindl = , XF86AudioNext, exec, $ipc media next
bindl = $mainMod CTRL SHIFT, C, exec, $ipc media next
bindl = , XF86AudioPlay, exec, $ipc media playPause
bindl = $mainMod CTRL SHIFT, S, exec, $ipc media playPause
bindl = , XF86AudioPrev, exec, $ipc media previous
bindl = $mainMod CTRL SHIFT, X, exec, $ipc media previous
bindel = CTRL , XF86AudioPrev, exec, $ipc media seekRelative -5
bindel = $mainMod CTRL SHIFT, A, exec, $ipc media seekRelative -5
bindel = CTRL , XF86AudioNext, exec, $ipc media seekRelative +5
bindel = $mainMod CTRL SHIFT, D, exec, $ipc media seekRelative +5

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, kitty
bind = $mainMod SHIFT, Return, exec, codium
bind = $mainMod, Q, killactive, 
bind = $mainMod CTRL, Q, forcekillactive, 
# bind = $mainMod, M, exec, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
