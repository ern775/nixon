# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule = match:fullscreen true, idle_inhibit always

# listener {
#     timeout = 330                                                     # 5.5min
#     on-timeout = hyprctl dispatch dpms off                            # screen off when timeout has passed
#     on-resume = hyprctl dispatch dpms on && brightnessctl -r          # screen on when activity is detected after timeout has fired.
# }

# workspace = 1, layout:scrolling

workspace = w[tv1]s[false], gapsout:0, gapsin:0
workspace = f[1]s[false], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]s[false]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]s[false]
windowrule = border_size 0, match:float 0, match:workspace f[1]s[false]
windowrule = rounding 0, match:float 0, match:workspace f[1]s[false]

windowrule {
  name = minecraft
  match:class = Minecraft.*

  rounding = 0
  no_anim = true
  no_max_size = true
  border_size = 0
  no_shadow = true
  decorate = false
  # force_rgbx = true
  suppress_event = "activate activatefocus maximize fullscreen fullscreenoutput"
  focus_on_activate = false
#   float = true
  immediate = true
  workspace = 2 silent
  idle_inhibit = always
  fullscreen = true
}

windowrule {
  name = games_name
