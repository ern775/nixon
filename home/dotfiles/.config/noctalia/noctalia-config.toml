[audio]
enable_sounds = false

[bar.default]
background_opacity = 0.4999999888241291
center = [ "media", "clock", "cat", "group:g1" ]
concave_edge_corners = false
end = [ "tray", "notifications", "volume", "bluetooth", "network", "brightness", "battery", "launcher" ]
margin_edge = 0
margin_ends = 0
padding = 8
position = "right"
scale = 1.1000000089406967
shadow = false
start = [ "taskbar" ]
widget_spacing = 11

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "start"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "temp", "ram", "network_rx", "network_tx" ]
    opacity = 0.0
    padding = 6.0
    widget_spacing = 2

[calendar]

[control_center]
show_shortcut_labels = false
width = 600

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "audio"

[desktop_widgets]
enabled = false

[idle]
pre_action_fade_seconds = 0

[location]
address = "Kötekli,Türkiye"

[lockscreen]
blur_intensity = 0.69999998435378075
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 128.0
    box_width = 810.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = false

[osd]
background_opacity = 0.69999998435378075
position = "bottom_center"
position_vertical = "bottom_center"

[plugins]
enabled = [ "dotnetrob/cat" ]

[shell]
clipboard_auto_paste = "off"
polkit_agent = true
settings_show_advanced = true

    [shell.launcher]
    auto_paste = "off"

    [shell.panel]
    borders = false
    clipboard_position = "bottom_right"
    control_center_placement = "floating"
    control_center_position = "center_right"
    launcher_position = "bottom_right"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    session_position = "center"
    shadow = false
    transparency_mode = "soft"

    [shell.session]
    grid_columns = 2

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "command"
        command = "systemctl soft-reboot"
        countdown_seconds = 5.0
        enabled = true
        label = "Userspace Reboot"
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

[theme]
builtin = "Tokyo-Night"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/eren/system/home/images"
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]

    [wallpaper.automation]
    recursive = false

    [wallpaper.default]
    path = "/home/eren/system/home/images/gruvbox-dark-blue.png"

    [wallpaper.last]
    path = "/home/eren/system/home/images/gruvbox-dark-blue.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/eren/system/home/images/gruvbox-dark-blue.png"

[widget.battery]
hide_when_full = true

[widget.brightness]
show_label = false

    [widget.brightness.actions]
    scroll_down = "brightness-down 1%"
    scroll_up = "brightness-up 1%"

[widget.cat]
cat_color = "on_surface"
cat_color_mode = "custom"
run_threshold = 30
type = "dotnetrob/cat:cat"

[widget.clock]
font_family = "Noto Sans"
scale = 0.94999999999999996

[widget.cpu]
show_value = false

[widget.launcher]
custom_image = "/run/current-system/sw/share/icons/hicolor/512x512/apps/nix-snowflake-white.png"
glyph = "snowflake"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.network_rx]
show_value = false

[widget.network_tx]
show_value = false

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
show_value = false

[widget.sysmon]
show_value = false
visualization = "none"

[widget.taskbar]
capsule_radius = "auto"
empty_color = "primary"
focused_color = "secondary"
font_scale = 1.2
group_by_workspace = true
hide_empty_workspaces = true
occupied_color = "primary"
workspace_label_placement = "centered"

[widget.temp]
show_value = false

[widget.volume]
mute_color = "#AD5454"
show_label = false

    [widget.volume.actions]
    scroll_down = "volume-down 2%"
    scroll_up = "volume-up 2%"

[widget.workspaces]
focused_output_only = true
hide_when_empty = true
labels_only_when_occupied = true
max_label_chars = 2

[system.monitor]
gpu_poll_seconds = 0
